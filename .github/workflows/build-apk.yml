name: Build Choko - Remastered APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Unpack ZIP and enable Android ETC2/ASTC compression
        id: locate
        run: |
          mkdir -p work_proj
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -qo "$ZIP_FILE" -d work_proj
          fi
          PROJ_FILE=$(find work_proj . -maxdepth 4 -name "project.godot" | head -n 1)
          if [ -z "$PROJ_FILE" ]; then
            echo "ERROR: project.godot not found."
            exit 1
          fi
          PROJ_DIR=$(cd "$(dirname "$PROJ_FILE")" && pwd)
          if ! grep -q "import_etc2_astc" "${PROJ_DIR}/project.godot"; then
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' "${PROJ_DIR}/project.godot"
          fi
          echo "project_dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $PROJ_DIR"

      - name: Download Godot 4 & Android export templates
        run: |
          VER="4.7.2-stable"
          BIN_ZIP="Godot_v${VER}_linux.x86_64.zip"
          if ! curl -fsSL -o "${BIN_ZIP}" "https://github.com/godotengine/godot/releases/download/${VER}/${BIN_ZIP}"; then
            VER=$(curl -fsSL https://api.github.com/repos/godotengine/godot/releases/latest | grep -m1 '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
            BIN_ZIP="Godot_v${VER}_linux.x86_64.zip"
            curl -fsSL -o "${BIN_ZIP}" "https://github.com/godotengine/godot/releases/download/${VER}/${BIN_ZIP}"
          fi
          unzip -q "${BIN_ZIP}" -d /tmp/godot_bin
          GODOT_BIN=$(find /tmp/godot_bin -maxdepth 2 -type f -name "Godot_v*" | head -n 1)
          chmod +x "${GODOT_BIN}"
          sudo mv "${GODOT_BIN}" /usr/local/bin/godot
          godot --version

          TEMPLATE_DIR_NAME="${VER/-/.}"
          TPZ_FILE="Godot_v${VER}_export_templates.tpz"
          curl -fsSL -o "${TPZ_FILE}" "https://github.com/godotengine/godot/releases/download/${VER}/${TPZ_FILE}"
          mkdir -p "${HOME}/.local/share/godot/export_templates/${TEMPLATE_DIR_NAME}"
          unzip -q "${TPZ_FILE}" -d /tmp/godot_tpl
          mv /tmp/godot_tpl/templates/* "${HOME}/.local/share/godot/export_templates/${TEMPLATE_DIR_NAME}/"
          rm -rf "${BIN_ZIP}" "${TPZ_FILE}" /tmp/godot_bin /tmp/godot_tpl

      - name: Configure Android SDK & debug keystore
        run: |
          mkdir -p "${HOME}/.android" "${HOME}/.config/godot"
          KEYSTORE_PATH="${HOME}/.android/debug.keystore"
          if [ ! -f "${KEYSTORE_PATH}" ]; then
            keytool -keyalg RSA -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -dname "CN=Android Debug,O=Choko,C=US" \
              -validity 9999 \
              -deststoretype pkcs12
          fi

          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          JAVA_PATH="${JAVA_HOME}"
          godot --headless --path "${{ steps.locate.outputs.project_dir }}" --import || true

          SETTINGS_FILES=$(find "${HOME}/.config/godot" -maxdepth 1 -name "editor_settings-4*.tres")
          if [ -z "${SETTINGS_FILES}" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "${HOME}/.config/godot/editor_settings-4.tres"
            SETTINGS_FILES="${HOME}/.config/godot/editor_settings-4.tres"
          fi

          for SF in ${SETTINGS_FILES}; do
            sed -i '/^export\/android\//d' "${SF}"
            printf 'export/android/java_sdk_path = "%s"\n' "${JAVA_PATH}" >> "${SF}"
            printf 'export/android/android_sdk_path = "%s"\n' "${SDK_PATH}" >> "${SF}"
            printf 'export/android/debug_keystore = "%s"\n' "${KEYSTORE_PATH}" >> "${SF}"
            printf 'export/android/debug_keystore_user = "androiddebugkey"\n' >> "${SF}"
            printf 'export/android/debug_keystore_pass = "android"\n' >> "${SF}"
          done

      - name: Export Choko - Remastered APK
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          mkdir -p build
          godot --headless --verbose --export-debug "Android" "build/choko-remastered.apk"
          cp build/choko-remastered.apk "${GITHUB_WORKSPACE}/choko-remastered.apk"
          ls -lh "${GITHUB_WORKSPACE}/choko-remastered.apk"

      - name: Upload APK directly
        uses: actions/upload-artifact@v7
        with:
          path: choko-remastered.apk
          archive: false
          retention-days: 30
          
